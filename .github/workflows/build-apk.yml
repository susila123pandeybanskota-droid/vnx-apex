      - name: Verify C source compiles
        run: |
          set -x
          set -o pipefail
          {
            gcc -O2 -Wall -o /tmp/vnxmem_host app/src/main/cpp/vnxmem.c -lm
            /tmp/vnxmem_host help > /tmp/vnxmem_help.txt
            head -3 /tmp/vnxmem_help.txt
            echo "C source OK"
          } 2>&1 | tee "$LOGDIR/04-verify-c.log"

      - name: Build native helper
        run: |
          set -x
          set -o pipefail
          {
            set -euo pipefail
            NDK="${ANDROID_HOME:?ANDROID_HOME unset}/ndk/${NDK_VERSION}"
            TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
            OUT=app/src/main/assets
            mkdir -p "$OUT"
            build() {
              local abi="$1" triple="$2"
              "$TC/${triple}24-clang" -O2 -static -fPIE -pie -ffunction-sections \
                -fdata-sections -Wl,--gc-sections -Wall \
                -o "$OUT/vnxmem-$abi" app/src/main/cpp/vnxmem.c -lm
              "$TC/llvm-strip" "$OUT/vnxmem-$abi"
              echo "built $abi -> $(stat -c%s "$OUT/vnxmem-$abi") bytes"
            }
            build arm64-v8a   aarch64-linux-android
            build armeabi-v7a armv7a-linux-androideabi
            build x86_64      x86_64-linux-android
            build x86         i686-linux-android
            for a in arm64-v8a armeabi-v7a x86_64 x86; do
              test -s "$OUT/vnxmem-$a" || { echo "::error::missing $a"; exit 1; }
            done
          } 2>&1 | tee "$LOGDIR/05-native.log"

      - name: Assemble debug + release
        run: |
          set -x
          set -o pipefail
          gradle --no-daemon --console=plain --warning-mode=all --stacktrace \
            assembleDebug assembleRelease 2>&1 | tee "$LOGDIR/06-gradle.log"

      - name: Build error dump
        if: failure()
        run: |
          set -x
          echo "=========== STEP LOGS (tail) ==========="
          for f in "$LOGDIR"/*.log; do
            [ -f "$f" ] || continue
            echo "----- $f -----"
            tail -n 120 "$f"
          done
          echo "=========== END ==========="

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/logs/**
          if-no-files-found: warn

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vnx-apex-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
