            cat > app/src/main/java/ai/venice/vnx/ShizukuGate.kt <<'EOF'
          package ai.venice.vnx

          import android.content.pm.PackageManager
          import androidx.activity.ComponentActivity
          import rikka.shizuku.Shizuku

          object ShizukuGate {
              private const val REQ = 1337
              private var attached = false

              fun attach(a: ComponentActivity) {
                  if (attached) return
                  attached = true
                  runCatching {
                      Shizuku.addRequestPermissionResultListener { id, _ -> if (id == REQ) Unit }
                  }
              }

              fun alive(): Boolean = runCatching { Shizuku.pingBinder() }.getOrDefault(false)

              fun granted(): Boolean = runCatching {
                  alive() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              }.getOrDefault(false)

              fun request() {
                  runCatching {
                      if (!alive()) return@runCatching
                      if (Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED) return@runCatching
                      if (Shizuku.shouldShowRequestPermissionRationale()) return@runCatching
                      Shizuku.requestPermission(REQ)
                  }
              }
          }
          EOF

            cat > app/src/main/java/ai/venice/vnx/Shell.kt <<'EOF'
          package ai.venice.vnx

          import rikka.shizuku.Shizuku

          object Shell {
              private const val MARK = "__VNX_EOF_9F3A__"
              private val lock = Any()
              private var proc: Process? = null

              private fun warm(): Process? {
                  proc?.let { if (it.isAlive) return it }
                  proc = null
                  if (!ShizukuGate.granted()) return null
                  val p = runCatching { Shizuku.newProcess(arrayOf("sh"), null, null) }.getOrNull()
                      ?: return null
                  proc = p
                  runCatching {
                      p.outputStream.write("echo ready\n".toByteArray())
                      p.outputStream.flush()
                      val buf = ByteArray(256)
                      val deadline = System.currentTimeMillis() + 600L
                      while (System.currentTimeMillis() < deadline) {
                          if (p.inputStream.available() > 0) { p.inputStream.read(buf); break }
                          Thread.sleep(5)
                      }
                  }
                  return p
              }

              private fun drop() {
                  runCatching { proc?.destroy() }
                  proc = null
              }

              fun exec(cmd: String, timeoutMs: Long = 90_000L): String = synchronized(lock) {
                  val p = warm() ?: return@synchronized "! shizuku not available"
                  try {
                      p.outputStream.write("$cmd 2>&1; echo $MARK\n".toByteArray())
                      p.outputStream.flush()
                  } catch (e: Exception) {
                      drop()
                      return@synchronized "! shell write failed: ${e.message}"
                  }
                  val sb = StringBuilder()
                  val buf = ByteArray(8192)
                  val deadline = System.currentTimeMillis() + timeoutMs
                  while (true) {
                      try {
                          if (p.inputStream.available() > 0) {
                              val n = p.inputStream.read(buf)
                              if (n <= 0) { drop(); return@synchronized "! shell closed" }
                              sb.append(String(buf, 0, n))
                              val s = sb.toString()
                              val i = s.indexOf(MARK)
                              if (i >= 0) return@synchronized s.substring(0, i).trim()
                          } else {
                              if (!p.isAlive) {
                                  drop()
                                  val s = sb.toString().trim()
                                  return@synchronized if (s.isEmpty()) "! shell closed" else s
                              }
                              if (System.currentTimeMillis() > deadline) {
                                  return@synchronized "! timeout ${timeoutMs}ms: $cmd"
                              }
                              Thread.sleep(5)
                          }
                      } catch (e: Exception) {
                          drop()
                          return@synchronized "! shell read failed: ${e.message}"
                      }
                  }
                  ""
              }
          }
          EOF

            cat > app/src/main/java/ai/venice/vnx/Auth.kt <<'EOF'
          package ai.venice.vnx

          import android.content.Context
          import java.security.MessageDigest

          object Auth {
              private const val SALT = "vnx-apex-9f3a"
              private const val USER = "venice"
              private const val PASS = "venice"

              private fun p(c: Context) = c.getSharedPreferences("vnx", Context.MODE_PRIVATE)

              private fun h(s: String): String =
                  MessageDigest.getInstance("SHA-256")
                      .digest((SALT + s).toByteArray())
                      .joinToString("") { "%02x".format(it) }

              fun seed(c: Context) {
                  val sp = p(c)
                  if (!sp.contains("u")) sp.edit().putString("u", USER).putString("h", h(PASS)).apply()
              }

              fun verify(c: Context, user: String, pass: String): Boolean {
                  seed(c)
                  val sp = p(c)
                  return sp.getString("u", "") == user.trim() && sp.getString("h", "") == h(pass)
              }

              fun loggedIn(c: Context) = p(c).getBoolean("in", false)
              fun login(c: Context) { p(c).edit().putBoolean("in", true).apply() }
              fun logout(c: Context) { p(c).edit().putBoolean("in", false).apply() }
          }
          EOF

            cat > app/src/main/java/ai/venice/vnx/Native.kt <<'EOF'
          package ai.venice.vnx

          import android.content.Context
          import android.os.Build
          import rikka.shizuku.Shizuku

          object Native {
              const val DIR = "/data/local/tmp/vnx"
              const val BIN = "$DIR/vnxmem"
              private val installed = HashSet<String>()

              private fun abis(ctx: Context): List<String> =
                  Build.SUPPORTED_ABIS.filter { a ->
                      runCatching { ctx.assets.open("vnxmem-$a").close(); true }.getOrDefault(false)
                  }

              fun install(ctx: Context): String {
                  val abi = abis(ctx).firstOrNull()
                      ?: return "! no helper for ${Build.SUPPORTED_ABIS.joinToString()}"
                  synchronized(installed) {
                      if (installed.contains(abi)) return "helper already installed ($abi)"
                      val bytes = ctx.assets.open("vnxmem-$abi").use { it.readBytes() }
                      val script = "mkdir -p $DIR; cat > $BIN; chmod 755 $BIN; " +
                          "test \"\$(stat -c%s $BIN)\" = \"${bytes.size}\" && test -x $BIN && echo OK"
                      val p = runCatching {
                          Shizuku.newProcess(arrayOf("sh", "-c", script), null, null)
                      }.getOrNull() ?: return "! shizuku.newProcess returned null"
                      try {
                          p.outputStream.use { it.write(bytes) }
                      } catch (e: Exception) {
                          return "! write failed: ${e.message}"
                      }
                      val out = p.inputStream.readBytes().toString(Charsets.UTF_8).trim()
                      val code = p.waitFor()
                      if (code != 0 || !out.contains("OK"))
                          return "! install failed exit=$code out=$out (expected ${bytes.size} bytes)"
                      installed.add(abi)
                      return "helper installed ($abi, ${bytes.size} bytes)"
                  }
              }

              private fun digits(s: String): Boolean = s.isNotEmpty() && s.all { it.isDigit() }

              fun pid(): String {
                  for (pkg in listOf("com.dts.freefireth", "com.dts.freefiremax")) {
                      val direct = Shell.exec("pidof $pkg").trim()
                          .split(" ").firstOrNull().orEmpty().trim()
                      if (digits(direct)) return direct

                      val ps = Shell.exec("ps -A -o PID,ARGS 2>/dev/null")
                      val line = ps.lines().firstOrNull { it.trim().endsWith(" $pkg") }
                      val viaPs = line?.trim()?.split(" ")?.firstOrNull().orEmpty()
                      if (digits(viaPs)) return viaPs
                  }
                  return ""
              }

              fun probe(pid: String) = if (pid.isBlank()) "! no pid" else Shell.exec("$BIN probe $pid")
              fun mods(pid: String) = if (pid.isBlank()) "! no pid" else Shell.exec("$BIN mods $pid")
              fun tracer(pid: String) = if (pid.isBlank()) "! no pid" else Shell.exec("$BIN tracerpid $pid")

              fun read(pid: String, a: String, n: String) =
                  if (pid.isBlank()) "! no pid" else Shell.exec("$BIN read $pid $a $n")

              fun write(pid: String, a: String, hex: String) =
                  if (pid.isBlank()) "! no pid" else Shell.exec("$BIN write $pid $a $hex")

              fun findm(pid: String, mod: String, t: String, p: String) =
                  if (pid.isBlank()) "! no pid" else Shell.exec("$BIN findm $pid $mod $t '$p'", 240_000L)

              fun fnew(pid: String, mod: String, t: String, v: String) =
                  if (pid.isBlank()) "! no pid" else Shell.exec("$BIN fnew $pid $mod $t $v", 240_000L)

              fun fnext(pid: String, t: String, v: String) =
                  if (pid.isBlank()) "! no pid" else Shell.exec("$BIN fnext $pid $t $v")

              fun frange(pid: String, t: String, lo: String, hi: String) =
                  if (pid.isBlank()) "! no pid" else Shell.exec("$BIN frange $pid $t $lo $hi")

              fun fshow(pid: String, limit: String) = Shell.exec("$BIN fshow $pid $limit")

              fun fset(pid: String, idx: String, t: String, v: String) =
                  if (pid.isBlank()) "! no pid" else Shell.exec("$BIN fset $pid $idx $t $v")

              fun fsnap(pid: String) = if (pid.isBlank()) "! no pid" else Shell.exec("$BIN fsnap $pid")
              fun frestore(pid: String) = if (pid.isBlank()) "! no pid" else Shell.exec("$BIN frestore $pid")
              fun freset() = Shell.exec("$BIN freset")

              fun aim(pid: String, cam: String, me: String, arr: String, count: String,
                      stride: String, posoff: String, smooth: String, fov: String,
                      mode: String, flags: String): String {
                  if (pid.isBlank()) return "! no pid"
                  val cmd = "$BIN aim $pid $cam $me $arr $count $stride $posoff $smooth $fov $mode $flags"
                  Shell.exec("( $cmd ) > $DIR/aim.log 2>&1 < /dev/null & echo started")
                  return "aim running -> $DIR/aim.log"
              }

              fun aimStop(): String {
                  Shell.exec("pkill -f '$BIN aim' 2>/dev/null")
                  return "aim stopped"
              }

              fun aimLog() = Shell.exec("tail -n 25 $DIR/aim.log 2>/dev/null || echo '(no log yet)'")

              fun selfTest(ctx: Context, pid: String): String {
                  val sb = StringBuilder()
                  var pass = 0
                  var fail = 0
                  fun step(name: String, ok: Boolean, detail: String) {
                      if (ok) pass++ else fail++
                      sb.append(if (ok) "[PASS] " else "[FAIL] ").append(name)
                      if (detail.isNotEmpty()) sb.append(" :: ").append(detail.take(120))
                      sb.append('\n')
                  }

                  val inst = install(ctx)
                  step("01 install helper", inst.startsWith("helper"), inst)
                  if (pid.isBlank()) {
                      step("02 game pid", false, "Free Fire not running")
                      return sb.append("\n").append(pass).append(" pass / ")
                               .append(fail).append(" fail").toString()
                  }
                  step("02 game pid", true, pid)

                  val pr = Shell.exec("$BIN probe $pid")
                  val prLine = pr.lines().firstOrNull { it.startsWith("RESULT") } ?: pr.take(90)
                  step("03 memory access", pr.contains("RESULT: OK"), prLine)

                  val tp = Shell.exec("$BIN tracerpid $pid").trim()
                  step("04 tracerpid is 0", tp.endsWith(" 0"), tp)

                  val md = Shell.exec("$BIN mods $pid")
                  val modCount = md.lines().count { it.isNotBlank() && !it.startsWith("!") }
                  step("05 list modules", modCount > 3, "$modCount modules")

                  val firstMod = md.lines().firstOrNull()?.trim()?.split(" ")
                      ?.firstOrNull().orEmpty()
                  if (firstMod.isNotEmpty()) {
                      val rdOut = Shell.exec("$BIN read $pid 0x$firstMod 32")
                      val hex = rdOut.lines().lastOrNull().orEmpty().trim()
                      step("06 read memory",
                           hex.length >= 32 && hex.all { it in "0123456789abcdefABCDEF" },
                           "${hex.length} hex chars")
                  } else {
                      step("06 read memory", false, "no module base found")
                  }

                  val f1 = Shell.exec("$BIN fnew $pid libil2cpp.so f 1.0", 240_000L)
                  val n1 = Regex("set (\\d+)").find(f1)?.groupValues?.get(1)?.toIntOrNull() ?: -1
                  step("07 filter new search", n1 > 0, "candidates=$n1")

                  if (n1 > 0) {
                      val f2 = Shell.exec("$BIN fnext $pid f 1.0")
                      val n2 = Regex("remaining (\\d+)").find(f2)
                          ?.groupValues?.get(1)?.toIntOrNull() ?: -1
                      step("08 filter narrow", n2 in 1..n1, "remaining=$n2")

                      val fs = Shell.exec("$BIN fshow $pid 3")
                      step("09 filter show", fs.contains("count "), fs.lines().lastOrNull().orEmpty())

                      val sn = Shell.exec("$BIN fsnap $pid")
                      step("10 snapshot", sn.contains("snapshot saved"), sn)

                      val rs = Shell.exec("$BIN frestore $pid")
                      step("11 restore (real write)", rs.contains("restored"), rs)
                  } else {
                      step("08 filter narrow", false, "no candidates")
                      step("09 filter show", false, "skipped")
                      step("10 snapshot", false, "skipped")
                      step("11 restore (real write)", false, "skipped")
                  }

                  Shell.exec("$BIN freset")
                  step("12 filter reset", true, "cleared")

                  return sb.append("\n").append(pass).append(" pass / ")
                           .append(fail).append(" fail").toString()
              }
          }
          EOF

            cat > app/src/main/java/ai/venice/vnx/OverlaySvc.kt <<'EOF'
          package ai.venice.vnx

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class OverlaySvc : Service() {
              companion object {
                  @Volatile var running = false
                  @Volatile var status = "VNX APEX"
                  private const val CH = "vnx"
              }

              private var wm: WindowManager? = null
              private var hud: TextView? = null
              private var orb: TextView? = null
              private var wake: PowerManager.WakeLock? = null
              private val ui = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() { hud?.text = status; ui.postDelayed(this, 1000L) }
              }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  running = true

                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  wake = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "vnx:aim").also { it.acquire() }

                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(
                          NotificationChannel(CH, "VNX", NotificationManager.IMPORTANCE_LOW))
                  }
                  val n = NotificationCompat.Builder(this, CH)
                      .setContentTitle("VNX Apex")
                      .setContentText("overlay + aim active")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setOngoing(true)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()

                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
                  mount()
                  ui.post(tick)
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun mount() {
                  val w = getSystemService(WINDOW_SERVICE) as WindowManager
                  wm = w
                  val type = if (Build.VERSION.SDK_INT >= 26)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      WindowManager.LayoutParams.TYPE_PHONE
                  val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS

                  val h = TextView(this).apply {
                      text = status
                      setTextColor(Color.parseColor("#39FF88"))
                      textSize = 11f
                      typeface = Typeface.MONOSPACE
                      setBackgroundColor(Color.parseColor("#99000000"))
                      setPadding(dp(8), dp(4), dp(8), dp(4))
                  }
                  val o = TextView(this).apply {
                      text = "VNX"
                      setTextColor(Color.parseColor("#39FF88"))
                      textSize = 10f
                      typeface = Typeface.MONOSPACE
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#66000000"))
                  }
                  hud = h
                  orb = o

                  val hp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type, flags, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = dp(12); y = dp(56) }

                  val op = WindowManager.LayoutParams(
                      dp(72), dp(72), type, flags, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.END; x = dp(12); y = dp(56) }

                  runCatching { w.addView(h, hp) }
                  runCatching { w.addView(o, op) }
              }

              override fun onDestroy() {
                  running = false
                  ui.removeCallbacks(tick)
                  val w = wm
                  val h = hud
                  val o = orb
                  if (w != null && h != null) runCatching { w.removeView(h) }
                  if (w != null && o != null) runCatching { w.removeView(o) }
                  runCatching { wake?.takeIf { it.isHeld }?.release() }
                  super.onDestroy()
              }
          }
          EOF

            cat > app/src/main/java/ai/venice/vnx/ReportCleaner.kt <<'EOF'
          package ai.venice.vnx

          object ReportCleaner {
              private val PKGS = listOf("com.dts.freefireth", "com.dts.freefiremax")

              fun run(): String {
                  val sb = StringBuilder()
                  var found = false
                  for (pkg in PKGS) {
                      if (!Shell.exec("pm path $pkg").contains("package:")) continue
                      found = true
                      Shell.exec("am force-stop $pkg")
                      for (root in listOf("/data/user/0/$pkg", "/data/data/$pkg")) {
                          Shell.exec(
                              "rm -f $root/files/*.log 2>/dev/null; " +
                              "rm -rf $root/cache/* 2>/dev/null; " +
                              "rm -rf $root/files/report* 2>/dev/null"
                          )
                      }
                      Shell.exec("monkey -p $pkg -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1")
                      sb.append("$pkg cleared + relaunched\n")
                  }
                  return if (found) sb.toString().trim() else "! Free Fire not installed"
              }
          }
          EOF

