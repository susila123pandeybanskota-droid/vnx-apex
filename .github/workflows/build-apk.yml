name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  LOGDIR: ${{ runner.temp }}/logs
  NDK_VERSION: 26.1.10909125

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;26.1.10909125'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preflight
        run: |
          set -x
          mkdir -p "$LOGDIR"
          set -o pipefail
          {
            fail=0
            [ -n "${ANDROID_HOME:-}" ]     || { echo "::error::ANDROID_HOME is empty"; fail=1; }
            [ -n "${ANDROID_SDK_ROOT:-}" ] || { echo "::error::ANDROID_SDK_ROOT is empty"; fail=1; }
            TC="${ANDROID_HOME:-/nonexistent}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
            [ -x "$TC/clang" ]      || { echo "::error::NDK clang missing at $TC/clang"; ls -la "${ANDROID_HOME:-/nonexistent}/ndk" 2>&1 || true; fail=1; }
            [ -x "$TC/llvm-strip" ] || { echo "::error::NDK llvm-strip missing at $TC/llvm-strip"; fail=1; }
            [ -d "${ANDROID_HOME:-/nonexistent}/platforms/android-35" ] || { echo "::error::platform android-35 missing"; fail=1; }
            command -v gcc >/dev/null || { echo "::error::gcc not found"; fail=1; }
            command -v gradle >/dev/null || { echo "::error::gradle not on PATH"; fail=1; }
            command -v gradle >/dev/null && { gradle --version 2>/dev/null | grep -q '8\.10\.2' || { echo "::error::gradle is not 8.10.2"; fail=1; }; }
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "NDK_TOOLCHAIN=$TC"
            exit $fail
          } 2>&1 | tee "$LOGDIR/01-preflight.log"

      - name: Keystore
        run: |
          set -x
          {
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          } 2>&1 | tee "$LOGDIR/02-keystore.log"

      - name: Scaffold
        run: |
          set -x
          {
            mkdir -p app/src/main/java/ai/venice/vnx app/src/main/cpp \
                     app/src/main/res/drawable app/src/main/res/values \
                     app/src/main/res/mipmap-anydpi app/src/main/res/mipmap-anydpi-v26 \
                     app/src/main/assets
            echo "sdk.dir=$ANDROID_HOME" > local.properties

            cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VNX"
          include(":app")
          EOF

            cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.0" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

            cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

            cat > app/proguard-rules.pro <<'EOF'
          -keep class rikka.shizuku.** { *; }
          -keep class moe.shizuku.** { *; }
          -dontwarn rikka.shizuku.**
          -dontwarn moe.shizuku.**
          -dontwarn androidx.compose.**
          EOF

            cat > app/build.gradle.kts <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "ai.venice.vnx"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ai.venice.vnx"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 8
                  versionName = "1.7"
              }

              buildTypes {
                  getByName("debug") {
